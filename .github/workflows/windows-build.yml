name: Windows build (manual, no release)
run-name: Beta 2 build from ${{ github.ref_name }} / run ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x86 / x64 (Beta 2)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '3'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the published source bytes on Windows
        run: git config --global core.autocrlf false

      - name: Check out this exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore exact release bytes without inherited line-ending filters
        run: |
          $attributes = git rev-parse --git-path info/attributes
          '* -text' | Set-Content -LiteralPath $attributes -Encoding ascii
          git checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { throw 'Exact source checkout failed' }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify Beta 2 corresponding source
        run: python scripts/ci/verify-source.py

      - name: Restore pinned tool downloads and native dependency cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci/downloads
            .ci/vcpkg-binary-cache
          key: windows-2022-x86-beta2-v1-${{ hashFiles('scripts/ci/setup-windows.ps1', 'source-x86/vcpkg.json', 'source-x86/res/vcpkg/**', 'source-x86/res/vcpkg-triplets/**') }}

      - name: Prepare Windows build environment
        run: ./scripts/ci/setup-windows.ps1

      - name: Save verified dependencies before compiling the client
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci/downloads
            .ci/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build the client and prepare an unsigned test package
        run: ./scripts/ci/build-windows.ps1

      - name: Check artifact metadata and hashes
        run: python scripts/ci/verify-artifact.py

      - name: Upload unsigned test package (not a GitHub Release)
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RuEkran-Windows-beta2-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ci-windows/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Write build summary
        run: |
          $metadata = Get-Content dist/ci-windows/BUILD-PROVENANCE.json -Raw | ConvertFrom-Json
          @"
          ## RuEkran $($metadata.version)
          - Source: $($metadata.commit)
          - Architecture: x86; x64 Windows uses WOW64
          - Artifact ID: ${{ steps.unsigned.outputs.artifact-id }}
          - Unsigned CI package only; no public release or website deployment
          - Sciter remains a proprietary dependency; SignPath eligibility is not asserted
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
